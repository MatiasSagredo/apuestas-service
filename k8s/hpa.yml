apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: casino-apuestas-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apuestas-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 67
